<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="t-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D28D"/>
      <stop offset="100%" stop-color="#00A86B"/>
    </linearGradient>
    <linearGradient id="t-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B87A"/>
      <stop offset="100%" stop-color="#008F5B"/>
    </linearGradient>
    <linearGradient id="blue-block" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="amber-block" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="mint-block" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <!-- Stylized 'T' shape -->
  <!-- Top bar -->
  <path d="M 22 22 C 22 17 26 14 32 14 L 70 14 C 76 14 80 18 80 24 C 80 29 76 34 70 34 L 56 34 L 56 78 C 56 83 52 86 46 86 L 38 86 C 35 86 32 83 32 80 L 32 34 L 28 34 C 24 34 22 30 22 26 Z" fill="url(#t-grad)"/>
  
  <!-- Subtle top-left folded leaf accent of T -->
  <path d="M 22 26 C 22 18 28 14 36 14 L 46 28 L 22 34 Z" fill="url(#t-fold)" opacity="0.85"/>

  <!-- The 3 Kanban blocks on the right -->
  <!-- Block 1: Blue -->
  <rect x="61" y="39" width="18" height="11" rx="4" fill="url(#blue-block)"/>
  
  <!-- Block 2: Amber -->
  <rect x="61" y="54" width="18" height="11" rx="4" fill="url(#amber-block)"/>
  
  <!-- Block 3: Mint -->
  <rect x="61" y="69" width="18" height="11" rx="4" fill="url(#mint-block)"/>
</svg>
