services:
  mariadb:
    image: mariadb:11.4
    container_name: kanban-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-minikanban}
      MARIADB_USER: ${DB_USER:-kanban}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local_dev_only_change_me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_only_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kanban-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://${DB_USER:-kanban}:${DB_PASSWORD:-local_dev_only_change_me}@mariadb:3306/${DB_NAME:-minikanban}"
      JWT_SECRET: "super-secret-jwt-key-kanban-2026"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - avatar_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kanban-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
  avatar_uploads:
